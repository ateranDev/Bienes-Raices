<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienes Raices</title>
    <link rel="stylesheet" href="build/css/app.css" />
  </head>
  <body>
    <header class="header">
      <div class="contenedor contenido-header">
        <div class="barra">
          <a href="/">
            <img src="build/img/logo.svg" alt="Logotipo de Bienes Raices" />
          </a>

          <div class="mobile-menu">
            <img src="build/img/barras.svg" alt="Menu Responsive" />
          </div>

          <div class="derecha">
            <img src="build/img/dark-mode.svg" class="dark-mode-boton" />
            <nav class="navegacion">
              <a href="nosotros.html">Nosotros</a>
              <a href="anuncios.html">Anuncios</a>
              <a href="blog.html">Blog</a>
              <a href="contacto.html">Contacto</a>
            </nav>
          </div>
        </div>
        <!--.barra-->
      </div>
    </header>

    <main class="contenedor seccion">
      <h1>Contacto</h1>
      <picture>
        <source srcset="build/img/destacada3.webp" type="image/webp" />
        <source srcset="build/img/destacada3.jgp" type="image/jpeg" />
        <img
          src="./build/img/destacada3.jpg"
          alt="Imagen contacto"
          loading="lazy"
        />
      </picture>
      <h2>Llene el formulario de contacto</h2>

      <form action="#" class="formulario">
        <fieldset>
          <legend>Información Personal</legend>

          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" />

          <label for="telefono">Telefono</label>
          <input type="tel" id="telefono" name="telefono" />

          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje"></textarea>
        </fieldset>

        <fieldset>
          <legend>Información sobre la propiedad</legend>
          <label for="opciones">Venta | Compra</label>
          <select name="opciones" id="opciones">
            <option value="" disabled selected>-- Seleccione --</option>
            <option value="Compra">Compra</option>
            <option value="Vende">Vende</option>
          </select>
          <label for="presupuesto">Precio o Presupuesto</label>
          <input type="number" id="presupuesto" name="presupuesto" />
        </fieldset>

        <fieldset>
          <legend>Contacto</legend>
          <p>¿Como desea ser contactado?</p>

          <div class="forma-contacto">
            <label for="contactar-telefono">Télefono</label>
            <input
              name="contacto"
              type="radio"
              id="contactar-telefono"
              value="telefono"
            />
            <label for="contactar-email">Email</label>
            <input
              name="contacto"
              type="radio"
              id="contactar-email"
              value="email"
            />
          </div>

          <p>Si elegié teléfono, elija fecha y la hora</p>

          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" />
          <label for="hora"></label>
          <input type="time" name="hora" id="hora" min="09:00" max="18:00" />
        </fieldset>
        <input type="submit" value="Enviar" class="boton-verde" />
      </form>
    </main>

    <footer class="footer seccion">
      <div class="contenedor contenedor-footer">
        <nav class="navegacion">
          <a href="nosotros.html">Nosotros</a>
          <a href="anuncios.html">Anuncios</a>
          <a href="blog.html">Blog</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
      <p class="copyright">Todos los derechos reservados 2026 &copy;</p>
    </footer>

    <script src="build/js/bundle.min.js"></script>
  </body>
</html>
